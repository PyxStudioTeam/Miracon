name: Feature request
description: Propose a scoped product or operational improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior rather than a preferred implementation.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Public website
        - Administrator
        - PostgreSQL or media
        - Release or cPanel operations
        - Migration or rollback tooling
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and acceptance evidence
      description: Note localization, privacy, security, migration, browser, database, or release requirements.
